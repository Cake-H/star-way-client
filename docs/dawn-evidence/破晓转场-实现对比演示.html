<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>破晓转场 · 实现对比演示（重构版）</title>
<!--
  说明：规范验收④引用的本文件在交付目录中缺失（全盘检索确认从未存在）。
  本文件按规范第二条内嵌的「路线 C 参考实现」逐字重构：
    · 左面板 = 规范原文管线（premultipliedAlpha:false + SRC_ALPHA），着色器逐字照抄（仅加 uScale 尺寸参数）
    · 右面板 = 交付修正管线（premultipliedAlpha:true + 预乘加法），带调参旋钮（仅色值/强度/尺寸，不动数学结构）
  面板背景 = 规范二.2 收紧后的 Hero 天空（球心径向渐变，2.5R 处回到 #F7F3EC）。
  滑杆 0–180° 映射 uPhase 0→1；uBright = 1 + 0.25·uPhase（白昼恒星态定格 1.25）。
-->
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f7f3ec; color: #2b2620; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 18px 28px 6px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { color: #7a7266; font-size: 12.5px; max-width: 1400px; }
  .panels { display: flex; gap: 28px; padding: 16px 28px; flex-wrap: wrap; }
  .panel { width: 640px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .stage {
    position: relative; width: 640px; height: 640px; border: 1px solid rgba(60,50,35,.1); border-radius: 8px; overflow: hidden;
    /* 规范二.2：球心径向渐变，2.5R(=267px) 处回到 --bg-base，之外纯净 */
    background: radial-gradient(circle 267px at 50% 50%, #f5e1c4 0%, #efe7d9 45%, #f7f3ec 100%);
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .controls { padding: 4px 28px 20px; max-width: 1400px; }
  .controls label { display: inline-flex; align-items: center; gap: 8px; margin: 6px 18px 6px 0; font-size: 12.5px; white-space: nowrap; }
  .controls input[type=range] { width: 160px; }
  .controls .deg { width: 260px; }
  button { font: inherit; padding: 4px 14px; border: 1px solid rgba(60,50,35,.22); background: #fcfaf6; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: rgba(176,105,26,.55); color: #b0691a; }
  pre { background: #fcfaf6; border: 1px solid rgba(60,50,35,.1); border-radius: 8px; padding: 12px 16px; font: 12px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 0 28px 28px; max-width: 1400px; }
</style>
</head>
<body>
<header>
  <h1>破晓转场 · 实现对比演示（重构版：原文管线 vs 交付管线）</h1>
  <div class="note">路线 C 面板即目标效果。面板背景＝球心径向渐变（2.5R 处回到 #F7F3EC）。滑杆拉到 180° ＝ 白昼恒星态（uPhase=1, uBright=1.25）。「采样剖面」输出两面板合成后亮度（含解析复合，与浏览器合成一致）。</div>
</header>
<div class="panels">
  <div class="panel">
    <h2>路线 C · 规范原文管线（premultipliedAlpha:false）</h2>
    <div class="stage" id="stageA"><canvas id="cvA"></canvas></div>
  </div>
  <div class="panel">
    <h2>路线 C · 交付修正管线（预乘加法 + 旋钮）</h2>
    <div class="stage" id="stageB"><canvas id="cvB"></canvas></div>
  </div>
</div>
<div class="controls">
  <label>进度 <input type="range" class="deg" id="deg" min="0" max="180" step="1" value="180"><span id="degVal">180°</span></label>
  <br>
  <label>uAlbMix（点亮混色系数，原文 0.38）<input type="range" id="albMix" min="0.38" max="1.0" step="0.01" value="0.38"><span id="albMixVal">0.38</span></label>
  <label>uLitEnd（白昼环境光端点，原文 0.76）<input type="range" id="litEnd" min="0.76" max="1.30" step="0.01" value="0.76"><span id="litEndVal">0.76</span></label>
  <label>uWin（光冕加法强度）<input type="range" id="win" min="0.02" max="0.60" step="0.01" value="0.45"><span id="winVal">0.45</span></label>
  <label>winR0（起始收束 uv）<input type="range" id="winR0" min="0.6" max="1.4" step="0.01" value="0.90"><span id="winR0Val">0.90</span></label>
  <label>winR1（归零 uv＝2.5R=1.43）<input type="range" id="winR1" min="1.0" max="2.0" step="0.01" value="1.43"><span id="winR1Val">1.43</span></label>
  <button id="sample">采样剖面</button>
</div>
<pre id="out">点击「采样剖面」。</pre>

<script>
'use strict'
/* ============ 着色器：路线 C 参考实现逐字照抄（规范第二条），仅追加 uScale 尺寸参数 ============ */
const VERT_SRC = `
attribute vec2 aP;
void main(){ gl_Position = vec4(aP, 0.0, 1.0); }
`
const FRAG_HEAD = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes; uniform float uTime; uniform float uPhase; uniform float uBright;
uniform float uScale;
@@EXTRA_UNIFORMS@@
float hash21(vec2 p){ p=fract(p*vec2(234.34,435.345)); p+=dot(p,p+34.23); return fract(p.x*p.y); }
float hash31(vec3 p){ p=fract(p*0.3183099+vec3(0.1,0.17,0.13)); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 x){
  vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  float n000=hash31(i), n100=hash31(i+vec3(1.,0.,0.)), n010=hash31(i+vec3(0.,1.,0.)), n110=hash31(i+vec3(1.,1.,0.));
  float n001=hash31(i+vec3(0.,0.,1.)), n101=hash31(i+vec3(1.,0.,1.)), n011=hash31(i+vec3(0.,1.,1.)), n111=hash31(i+vec3(1.,1.,1.));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<4;i++){ s+=a*noise3(p); p=p*2.03+vec3(1.7,9.2,4.1); a*=0.5; } return s; }

void main(){
  vec2 uv = ((gl_FragCoord.xy*2.0 - uRes) / uRes.y) / uScale;   // uScale：视直径尺寸参数（规范允许）
  float az = mix(-0.5, 0.35, uPhase);                   // 高光自左向右扫过球面（光源始终在前方，亮度单调递增）
  vec3 L = normalize(vec3(sin(az), 0.28, cos(az)));
  float rot = uPhase * 3.14159265;                      // 球面纹理真实自转 180°
  vec3 ro = vec3(0.0, 0.0, 3.1);
  vec3 rd = normalize(vec3(uv*0.92, -1.55));
  float b = dot(ro, rd);
  float cc = dot(ro, ro) - 1.0;
  float h = b*b - cc;                                   // 光线-球体求交判别式
  float sunAmt = 0.32 + 0.62*uPhase;                    // 常态微光晕 → 破晓强光冕
  vec3 col = vec3(0.0); float alpha = 0.0;
  if (h > 0.0) {                                        // 命中球面
    float th = -b - sqrt(h);
    vec3 p = ro + rd*th;
    vec3 n = normalize(p);
    float dl = dot(n, L);
    vec3 nt = vec3(n.x*cos(rot)+n.z*sin(rot), n.y, -n.x*sin(rot)+n.z*cos(rot));  // 自转后的采样法线
    float surf = fbm(nt*2.4 + vec3(7.3, 2.9, 5.1));
    float detail = fbm(nt*6.0 + vec3(1.0));
    float mottle = smoothstep(0.35, 0.75, surf + detail*0.25);
    vec3 alb = mix(vec3(0.56,0.38,0.135), vec3(0.84,0.60,0.27), mottle);  // 原版暖金，低对比
    alb *= 1.0 - mix(0.18, 0.06, uPhase)*smoothstep(0.55, 0.80, fbm(nt*1.6 + vec3(11.0)));  // 暗斑随点亮淡出
@@ALB_LINE@@
@@LIT_LINE@@
    vec3 sc = alb * lit * vec3(1.0, 0.94, 0.82);
    vec3 hv = normalize(L - rd);
    sc += vec3(1.0,0.95,0.85) * pow(max(dot(n,hv), 0.0), 26.0) * 0.48;   // 珍珠光泽高光
    sc += vec3(0.35,0.18,0.05) * smoothstep(-0.25,0.15,dl) * (1.0-smoothstep(0.15,0.6,dl)) * 0.4;  // 晨昏暖带
    sc *= uBright;
    float fres = pow(1.0 - max(dot(n,-rd), 0.0), 3.0);  // 菲涅尔大气边缘光
    sc += vec3(1.0,0.72,0.34) * fres * (0.35 + 0.65*uPhase) * (0.4 + 0.6*smoothstep(-0.5,0.6,dl)) * uBright;
    col = sc; alpha = 1.0;
  } else {                                              // 越邻解析光晕（三层光冕）
    float closest = sqrt(max(dot(ro,ro) - b*b, 0.0));
    float g = max(closest - 1.0, 0.0);
    float glow = (exp(-g*9.0)*0.55 + exp(-g*3.2)*0.30 + exp(-g*1.5)*0.14*uPhase) * sunAmt * uBright * (1.0+0.65*uPhase);
@@HALO@@
  }
  col = 1.0 - exp(-col*1.6);                            // filmic 色调映射
  col = pow(col, vec3(0.92));
  col *= 0.94 + 0.12*hash21(gl_FragCoord.xy*0.71 + fract(uTime)*13.0);  // 胶片颗粒
  gl_FragColor = vec4(col, alpha);
}
`
/* 原文管线：逐字输出（规范原文） */
const HALO_VERBATIM = `
    col = vec3(1.0, 0.66, 0.30) * glow;
    alpha = clamp(glow*1.25, 0.0, 0.98);
`
/* 交付管线：预乘加法（亮主题下只增亮、不压暗；夜间合成结果与原文逐位一致） */
const HALO_FIXED = `
    vec3 light = vec3(1.0, 0.66, 0.30) * glow;
    light = 1.0 - exp(-light*1.6);
    light = pow(light, vec3(0.92));
    light *= 0.94 + 0.12*hash21(gl_FragCoord.xy*0.71 + fract(uTime)*13.0);
    float a = clamp(glow*1.25, 0.0, 0.98);
    float win = (1.0 - smoothstep(uWinR0, uWinR1, length(uv))) * uWin;
    col = mix(light * a * a * a, light * win, uPhase);
    alpha = a * a * (1.0 - uPhase);
    gl_FragColor = vec4(col, alpha);
    return;
`
const ALB_VERBATIM = `    alb = mix(alb, vec3(1.0,0.82,0.48), uPhase*0.38);   // 球面随点亮向亮金推移`
const ALB_KNOB     = `    alb = mix(alb, vec3(1.0,0.82,0.48)*uAlbBoost, uPhase*uAlbMix);   // 旋钮：点亮混色系数 × 目标色增亮（原文 0.38 / 1.0）`
const LIT_VERBATIM = `    float lit = mix(0.50, 0.76, uPhase) + 0.60*max(dl, 0.0);  // 环境底光：永不变黑，随相位提亮`
const LIT_KNOB     = `    float lit = mix(0.50, uLitEnd, uPhase) + 0.60*max(dl, 0.0);  // 旋钮：白昼环境光端点（原文 0.76）`

/* 相机尺寸参数：着色器原始几何下星球 uv 半径 ≈ 0.5742；画布边长 = 3 × 星球直径 */
const PLANET_VIEW_SCALE = 1 / (0.5742 * 3)
const R_UV = 0.5742 / 0.92 * 0.92 / 1.0 // 占位避免误用

function buildSrc(verbatim) {
  return FRAG_HEAD
    .replace('@@EXTRA_UNIFORMS@@', verbatim ? '' : 'uniform float uAlbMix; uniform float uAlbBoost; uniform float uLitEnd; uniform float uWin; uniform float uWinR0; uniform float uWinR1;')
    .replace('@@ALB_LINE@@', verbatim ? ALB_VERBATIM : ALB_KNOB)
    .replace('@@LIT_LINE@@', verbatim ? LIT_VERBATIM : LIT_KNOB)
    .replace('@@HALO@@', verbatim ? HALO_VERBATIM : HALO_FIXED)
}

function makeRenderer(canvas, verbatim) {
  const gl = canvas.getContext('webgl', verbatim
    ? { alpha: true, premultipliedAlpha: false, antialias: false }   // 规范原文管线
    : { alpha: true, premultipliedAlpha: true, antialias: false })   // 交付修正管线
  if (!gl) throw new Error('WebGL 上下文创建失败')
  function compile(type, src) {
    const s = gl.createShader(type)
    gl.shaderSource(s, src); gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('着色器编译失败: ' + gl.getShaderInfoLog(s))
    return s
  }
  const prog = gl.createProgram()
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT_SRC))
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, buildSrc(verbatim)))
  gl.linkProgram(prog)
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('着色器链接失败: ' + gl.getProgramInfoLog(prog))
  gl.useProgram(prog)
  const buf = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, buf)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW)
  const aP = gl.getAttribLocation(prog, 'aP')
  gl.enableVertexAttribArray(aP)
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0)
  gl.enable(gl.BLEND)
  if (verbatim) gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
  else gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA)
  gl.clearColor(0, 0, 0, 0)
  const U = {}
  for (const n of ['uRes','uTime','uPhase','uBright','uScale','uAlbMix','uAlbBoost','uLitEnd','uWin','uWinR0','uWinR1']) U[n] = gl.getUniformLocation(prog, n)
  const dpr = Math.min(window.devicePixelRatio || 1, 2)
  const size = 640
  canvas.width = Math.floor(size * dpr); canvas.height = Math.floor(size * dpr)
  gl.viewport(0, 0, canvas.width, canvas.height)
  if (U.uScale) gl.uniform1f(U.uScale, PLANET_VIEW_SCALE)
  return { gl, U, canvas, dpr, size, verbatim }
}

function render(r, phase, knobs) {
  const { gl, U } = r
  gl.clear(gl.COLOR_BUFFER_BIT)
  gl.uniform2f(U.uRes, r.canvas.width, r.canvas.height)
  gl.uniform1f(U.uTime, 1.0)                  // 固定颗粒相位，保证采样可复现
  gl.uniform1f(U.uPhase, phase)
  gl.uniform1f(U.uBright, 1 + 0.25 * phase)   // 白昼恒星态定格 1.25
  if (!r.verbatim) {
    gl.uniform1f(U.uAlbMix, knobs.albMix)
    gl.uniform1f(U.uAlbBoost, knobs.boost)
    gl.uniform1f(U.uLitEnd, knobs.litEnd)
    gl.uniform1f(U.uWin, knobs.win)
    gl.uniform1f(U.uWinR0, knobs.winR0)
    gl.uniform1f(U.uWinR1, knobs.winR1)
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
}

/* 面板背景渐变解析求值（与 CSS radial-gradient(circle 267px …) 一致） */
function hexRGB(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)] }
const STOPS = [[0, hexRGB('#f5e1c4')], [0.45, hexRGB('#efe7d9')], [1, hexRGB('#f7f3ec')]]
function bgAt(cssX, cssY) {
  const d = Math.hypot(cssX - 320, cssY - 320)
  const t = Math.min(1, d / 267)
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const k = (t - STOPS[i-1][0]) / (STOPS[i][0] - STOPS[i-1][0])
      return STOPS[i-1][1].map((c, j) => c + (STOPS[i][1][j] - c) * k)
    }
  }
  return STOPS[STOPS.length-1][1]
}

const knobs = { albMix: 0.38, boost: 1.0, litEnd: 0.76, win: 0.45, winR0: 0.90, winR1: 1.43 }
let phase = 1
let rA, rB
try {
  rA = makeRenderer(document.getElementById('cvA'), true)
  rB = makeRenderer(document.getElementById('cvB'), false)
} catch (e) {
  document.getElementById('out').textContent = '❌ ' + e.message
  throw e
}
function renderAll() { render(rA, phase, knobs); render(rB, phase, knobs) }
renderAll()

function bind(id, fn) {
  const el = document.getElementById(id)
  const lab = document.getElementById(id + 'Val')
  el.addEventListener('input', () => { fn(parseFloat(el.value)); if (lab) lab.textContent = el.value; renderAll() })
}
bind('deg', v => { phase = v / 180; document.getElementById('degVal').textContent = v + '°' })
bind('albMix', v => knobs.albMix = v)
bind('litEnd', v => knobs.litEnd = v)
bind('win', v => knobs.win = v)
bind('winR0', v => knobs.winR0 = v)
bind('winR1', v => knobs.winR1 = v)

const lum = c => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]

/* 采样前从 DOM 同步全部控件（防浏览器表单恢复污染状态），并修正 R：uv 半径 0.5742 经 uScale 缩放 */
function syncFromDom() {
  phase = parseFloat(document.getElementById('deg').value) / 180
  for (const k of ['albMix', 'litEnd', 'win', 'winR0', 'winR1']) knobs[k] = parseFloat(document.getElementById(k).value)
}
// 加载即强制控件回默认值（file:// 重载时浏览器可能恢复旧表单值）
for (const [id, v] of [['deg', 180], ['albMix', 0.38], ['litEnd', 0.76], ['win', 0.45], ['winR0', 0.90], ['winR1', 1.43]]) {
  const el = document.getElementById(id)
  el.value = v
  const lab = document.getElementById(id + 'Val')
  if (lab) lab.textContent = id === 'deg' ? v + '°' : v
}

function grab(r) {
  // 同一 task 内 render + 一次性整幅 readPixels（无 preserveDrawingBuffer 也有效），后续全部从内存取
  render(r, phase, knobs)
  const w = r.canvas.width, h = r.canvas.height
  const raw = new Uint8Array(w * h * 4)
  r.gl.readPixels(0, 0, w, h, r.gl.RGBA, r.gl.UNSIGNED_BYTE, raw)
  return { raw, w, h }
}
function pxAt(snap, r, cssX, cssY) {
  const gx = Math.min(snap.w - 1, Math.max(0, Math.floor(cssX * r.dpr)))
  const gy = Math.min(snap.h - 1, Math.max(0, Math.floor((r.size - cssY) * r.dpr)))
  const i = (gy * snap.w + gx) * 4
  return [snap.raw[i] / 255, snap.raw[i + 1] / 255, snap.raw[i + 2] / 255, snap.raw[i + 3] / 255]
}
function composite(r, buf, bg) {
  const a = buf[3]
  return r.verbatim
    ? [0, 1, 2].map(i => Math.min(1, buf[i] * a + bg[i] * (1 - a)))   // 非预乘解释：out = buf.rgb·buf.a + bg·(1-buf.a)
    : [0, 1, 2].map(i => Math.min(1, buf[i] + bg[i] * (1 - a)))        // 预乘：out = buf.rgb + bg·(1-buf.a)（浏览器按 255 截断）
}

document.getElementById('sample').addEventListener('click', () => {
  syncFromDom()
  const sA = grab(rA), sB = grab(rB)
  const R = 0.5742 * PLANET_VIEW_SCALE / 2 * 640  // 球体 CSS 半径 ≈ 106.7（画布 640 = 3 × 直径）
  const ds = [0, 0.3, 0.5, 0.7, 0.85, 1.0, 1.05, 1.15, 1.3, 1.6, 2.0, 2.5, 2.9]
  const lines = []
  lines.push(`uPhase=${phase.toFixed(2)} uBright=${(1+0.25*phase).toFixed(2)}  R=${R.toFixed(1)}css px  旋钮: albMix=${knobs.albMix} litEnd=${knobs.litEnd} win=${knobs.win} winR0=${knobs.winR0} winR1=${knobs.winR1}`)
  lines.push('d(R) | bg亮度 | C原文合成 | C′合成 | (采样：球心向左水平线，GL 缓冲解析复合)')
  for (const d of ds) {
    const cssX = 320 - d * R, cssY = 320
    const bg = bgAt(cssX, cssY).map(v => v / 255)
    const cols = [[rA, sA], [rB, sB]].map(([r, s]) => {
      const out = composite(r, pxAt(s, r, cssX, cssY), bg)
      return lum(out.map(v => v * 255))
    })
    lines.push(`${d.toFixed(2).padStart(4)}R | ${lum(bg.map(v => v * 255)).toFixed(1).padStart(6)} | ${cols[0].toFixed(1).padStart(7)} | ${cols[1].toFixed(1).padStart(7)}`)
  }
  // 高光点（球区亮度峰值扫描，内存数组，无 GPU 往返）
  for (const [name, r, s] of [['原文', rA, sA], ['交付', rB, sB]]) {
    let maxL = 0, maxAt = null
    for (let y = 320 - R; y <= 320 + R; y += 2) for (let x = 320 - R; x <= 320 + R; x += 2) {
      const out = composite(r, pxAt(s, r, x, y), bgAt(x, y).map(v => v / 255))
      const L = lum(out.map(v => v * 255))
      if (L > maxL) { maxL = L; maxAt = [Math.round(x), Math.round(y)] }
    }
    lines.push(`${name}面板球区峰值亮度 ${maxL.toFixed(1)} @(${maxAt})`)
  }
  document.getElementById('out').textContent = lines.join('\n')
})
</script>
</body>
</html>
